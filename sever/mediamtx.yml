# SucStudio MediaMTX gateway. Replace every CHANGE_ME value before starting.
logLevel: info

# Keep the RTSP relay internal to the Docker network. FFmpeg uses TCP to read it.
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

# Browser WHIP publishing endpoint (HTTPS is terminated by Caddy).
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["https://manhsuc93.github.io"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: ["stream.YOUR-DOMAIN.vn"]

# The browser authenticates as studio. FFmpeg reads the local RTSP path as relay.
authMethod: internal
authInternalUsers:
  - user: studio
    pass: CHANGE_ME_STUDIO_PASSWORD
    ips: []
    permissions:
      - action: publish
        path: live
  - user: relay
    pass: CHANGE_ME_RELAY_PASSWORD
    ips: [127.0.0.1]
    permissions:
      - action: read
        path: live

paths:
  live:
    source: publisher
    # Safari sends WebRTC audio as Opus. FFmpeg converts it to AAC for RTMP/RTMPS.
    # Video is copied without re-encoding; Live Studio requests H.264 where supported.
    runOnReady: >-
      ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp
      -i rtsp://relay:CHANGE_ME_RELAY_PASSWORD@127.0.0.1:8554/live
      -map 0:v:0 -map 0:a:0 -c:v copy -c:a aac -b:a 128k -ar 44100 -ac 2
      -f flv "rtmps://a.rtmps.youtube.com/live2/CHANGE_ME_YOUTUBE_STREAM_KEY"
      -map 0:v:0 -map 0:a:0 -c:v copy -c:a aac -b:a 128k -ar 44100 -ac 2
      -f flv "rtmps://live-api-s.facebook.com:443/rtmp/CHANGE_ME_FACEBOOK_STREAM_KEY"
    runOnReadyRestart: yes
